name: Validate Windows Agent PowerShell
on:
  push:
    paths:
      - "agents/**"
      - ".github/workflows/validate-windows-agent.yml"
  pull_request:
    paths:
      - "agents/**"
      - ".github/workflows/validate-windows-agent.yml"
jobs:
  parse-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script without executing it
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path agents -Filter '*.ps1' -Recurse
          $errorsCount = 0
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($error in $errors) {
                Write-Error "$($file.FullName):$($error.Extent.StartLineNumber) $($error.Message)"
              }
              $errorsCount += $errors.Count
            } else {
              Write-Host "OK: $($file.Name)"
            }
          }
          if ($errorsCount -gt 0) { exit 1 }
